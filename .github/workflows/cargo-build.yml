name: Cargo Build

on:
  push:
    paths:
      - "cargo.toml"
      - "cargo.lock"
      - ".cargo/**"
      - "src/**"
  pull_request:
    paths:
      - "cargo.toml"
      - "cargo.lock"
      - ".cargo/**"
      - "src/**"

env: 
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [nightly]

    name: Cargo build ${{ matrix.toolchain }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Rustup setup
        run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose
        env:
          RUSTFLAGS: "-D warnings"
